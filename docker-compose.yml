version: '3.8'

services:
  nettraffic-sentinel:
    build: .
    image: nettraffic-sentinel:latest
    container_name: nettraffic-sentinel

    # 必须使用 host 网络模式以直接监听物理网卡
    network_mode: host

    # 抓包需要这两个 Linux capability
    cap_add:
      - NET_RAW
      - NET_ADMIN

    sysctls:
      # 允许单个 socket 申请最大 128MB 的接收缓冲区。
      # 默认值通常仅 212KB，BT 下载等高并发场景会导致内核层丢包，
      # 流量统计因此严重偏低（可达 30-70%），必须调大此值。
      - net.core.rmem_max=134217728
      - net.core.rmem_default=134217728

    environment:
      - MONITOR_IFACE=eth0              # 修改为你的网卡名
      - TZ=Asia/Shanghai                # 时区：影响今日/本月统计的日期归属，必须与你所在时区一致
      - EXCLUDE_IPV6_PREFIX=            # 留空则自动检测 GUA /56；手动指定示例：240e:33e:2f08:d600::/56
      - WEB_PORT=8080
      - SAVE_INTERVAL=300               # 每5分钟持久化一次
      - DB_PATH=/data/traffic.db

    volumes:
      - ./data:/data                    # SQLite 数据持久化目录

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; port=os.environ.get('WEB_PORT', '8080'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
